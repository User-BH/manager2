# ==============================================================================
#  دروازه‌ی یکپارچه‌سازی (R42)
# ==============================================================================
#
#  ─── چرا این کارها و نه بیشتر ─────────────────────────────────────────────
#  دقیقاً همان چیزهایی اجرا می‌شوند که در `.husky/pre-commit` هم هست. اگر CI
#  سخت‌گیرتر از قلابِ محلی باشد، توسعه‌دهنده کامیت می‌کند و بعد در CI
#  می‌افتد — و آن حلقه‌ی رفت‌وبرگشت خودش هزینه است. اگر شل‌تر باشد، اصلاً
#  دروازه نیست.
#
#  ─── ترتیبی که اجباری است و اندازه‌گیری شد ────────────────────────────────
#  ⚠️ تست‌های PHP **پس از** بیلدِ فرانت اجرا می‌شوند، نه موازی با آن.
#
#  اندازه‌گیری: با پاک‌کردنِ `public/build` و اجرای `php artisan test`، خطای
#  `Illuminate\Foundation\Vite::asset("resources/images/hero-building.webp")`
#  گرفته شد. صفحه‌ی فرود از R38 تصویرِ LCP را با `Vite::asset()` preload
#  می‌کند و آن تابع بدونِ manifest می‌ترکد. پس هر تستِ Featureی که صفحه‌ای
#  را باز می‌کند، به بیلد نیاز دارد.
# ==============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # اجرای دستی، برای وقتی که می‌خواهید بدونِ کامیتِ تازه دوباره بسنجید
  workflow_dispatch:
  # ⚠️ هفتگی (مرحلهٔ ۵ · فاز ۹ · بندِ ۷۱): آسیب‌پذیریِ تازه بی‌کامیت هم
  # منتشر می‌شود. بدونِ این، مخزنی که یک ماه دست نخورد یک ماه ممیزی نمی‌شد.
  schedule:
    - cron: '30 3 * * 1'

# ⚠️ اجرای قبلیِ همان شاخه لغو می‌شود.
#
# بدونِ این، هر push روی یک PRِ فعال یک اجرای تازه می‌سازد و اجراهای کهنه
# تا آخر می‌دوند — یعنی صفِ CI با نتیجه‌ای پر می‌شود که دیگر کسی نگاهش
# نمی‌کند. برای `main` عمداً لغو نمی‌شود، چون تاریخچه‌ی سبز/قرمزِ آن شاخه
# باید کامل بماند.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────────────────
  #  فرانت: قالب، تایپ، لینت، تست، بیلد
  # ────────────────────────────────────────────────────────────────────────
  frontend:
    name: فرانت
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # `npm ci` و نه `npm install`: دقیقاً همان نسخه‌های قفل‌شده
      - name: نصب وابستگی‌ها
        run: npm ci

      - name: قالب‌بندی
        run: npm run format:check

      - name: تایپ
        run: npm run typecheck

      # ⚠️ سقفِ هشدار در خودِ `package.json` است (`--max-warnings=0`).
      # اینجا تکرار نمی‌شود تا دو جا از هم جدا نیفتند.
      - name: لینت
        run: npm run lint

      - name: بیلد
        run: npm run build

      # ⚠️ تستِ بودجه‌ی باندل (R36) به `public/build` نیاز دارد، پس **پس
      # از** بیلد اجرا می‌شود. اگر پیش از آن بیاید، `describe.skipIf`
      # کلِ سقف‌ها را بی‌صدا رد می‌کند و دروازه پوچ می‌شود.
      - name: تست
        run: npm run test

      - name: نگه‌داشتنِ خروجیِ بیلد برای مرحله‌ی بعد
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: public/build
          retention-days: 1

  # ────────────────────────────────────────────────────────────────────────
  #  بک‌اند: Pint، PHPStan، PHPUnit
  # ────────────────────────────────────────────────────────────────────────
  backend:
    name: بک‌اند
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: frontend

    steps:
      - uses: actions/checkout@v4

      - name: نصب PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # ⚠️ فهرست از `composer.lock` بیرون کشیده شده، نه از حدس.
          # `gd` برای mPDF و `pwa:splash` لازم است، `zip` برای خروجیِ Excel.
          extensions: gd, zip, intl, bcmath, pdo_sqlite, sqlite3, mbstring, exif
          # تست‌ها روی SQLiteِ درون‌حافظه‌ای‌اند، ولی PDFِ فارسی حافظه
          # می‌خواهد (اندازه‌گیریِ R28)
          ini-values: memory_limit=512M
          coverage: none

      - name: کشِ Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: نصب وابستگی‌ها
        run: composer install --prefer-dist --no-interaction --no-progress

      # ⚠️ خروجیِ بیلد از مرحله‌ی قبل می‌آید، نه از بیلدِ دوباره.
      #
      # بیلدِ دوباره یعنی نصبِ کاملِ Node در این job — چند دقیقه برای چیزی
      # که همین حالا ساخته شده. مهم‌تر: دو بیلدِ جدا می‌توانند نتیجه‌ی
      # متفاوت بدهند و آن‌وقت تست چیزی را می‌سنجد که مستقر نمی‌شود.
      - name: بازیابیِ خروجیِ بیلد
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: public/build

      - name: آماده‌سازیِ محیط
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: قالب‌بندیِ کد
        run: composer lint

      - name: تحلیل ایستا
        run: composer analyse

      - name: تست
        run: php artisan test

  # ────────────────────────────────────────────────────────────────────────
  #  سرتاسری روی سه موتورِ رندر (R70)
  # ────────────────────────────────────────────────────────────────────────
  #
  #  ⚠️ تا پیش از R70، Playwright **فقط محلی و فقط روی کرومیوم** اجرا
  #  می‌شد — یعنی هیچ دروازه‌ای جلوی خرابیِ مخصوصِ یک موتور را نمی‌گرفت.
  #
  #  🔴 و همان اجرا ثابت کرد که این خلأ واقعی بود: تستِ «دارایی‌های Vite
  #  هش‌دار سرو می‌شوند» در WebKit افتاد، چون بلافاصله پس از `goto` هنوز
  #  چیزی رندر نشده بود. کرومیوم به‌قدری سریع بود که تست **اتفاقی** سبز
  #  می‌شد.
  #
  #  ⚠️ چرا اوبونتو و نه ویندوز: بیلدِ ویندوزیِ فایرفاکسِ Playwright روی
  #  ماشینِ توسعه با خطای side-by-side بالا نمی‌آید (اسمبلیِ خصوصیِ
  #  `mozglue` پیدا نمی‌شود). روی رانرِ لینوکسی چنین مفهومی وجود ندارد و
  #  هر سه موتور اجرا می‌شوند.
  e2e:
    name: سرتاسری (سه موتور)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: frontend

    steps:
      - uses: actions/checkout@v4

      - name: نصب PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, zip, intl, bcmath, pdo_sqlite, sqlite3, mbstring, exif
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: کشِ Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: نصب وابستگی‌ها
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci

      # ⚠️ خروجیِ همان بیلدی که بقیه‌ی jobها می‌سنجند، نه بیلدِ دوباره.
      - name: بازیابیِ خروجیِ بیلد
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: public/build

      - name: آماده‌سازیِ محیط
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force --no-interaction
          # ⚠️ بدونِ داده، سفرِ مالی چیزی برای طی‌کردن ندارد و تست‌هایش
          # سبزِ بی‌معنا می‌شوند (S4-30).
          php artisan db:seed --class=DemoSeeder --force --no-interaction
          # 🔴 ورودِ این پروژه دومرحله‌ای است (رمز → کدِ پیامکی). کدِ پیامکی از
          # مرورگر خواندنی نیست، پس سفرِ مالی هرگز شروع نمی‌شد.
          #
          # ⚠️ `otp_disabled` یک تنظیمِ **واقعیِ محصول** است («برای وقتی پنلِ
          # پیامک هنوز آماده نیست»)، نه دور زدنِ امنیت در تست. خودِ OTP
          # پوششِ جدا دارد: PhoneLoginTest و SessionSecurityTest.
          php artisan tinker --execute="App\Support\SystemSettings::set('otp_disabled', true);"
          # مرحلهٔ ۵ · فاز ۸: موجودیِ کیف برای سفرِ «پرداخت از کیف» — از خودِ
          # WalletService، نه درجِ مستقیم؛ روی محصول اجرا نمی‌شود.
          php artisan db:seed --class=E2eSeeder --force --no-interaction
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

      # ⚠️ کش بر اساسِ **نسخه‌ی دقیقِ** Playwright: با هر ارتقا، مرورگرها
      # هم عوض می‌شوند و کشِ کهنه یعنی اجرای تست روی موتوری که دیگر
      # نصب‌شده نیست.
      - name: کشِ مرورگرها
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: نصب مرورگرها
        run: npx playwright install --with-deps chromium firefox webkit

      - name: تستِ سرتاسری
        run: npx playwright test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          # مرحلهٔ ۵ · فاز ۸: سفرِ خریدِ اشتراک با درگاهِ آزمایشی. سرورِ
          # `php artisan serve` این متغیرها را از همین گام به ارث می‌برد.
          SUBSCRIPTION_GATEWAY: sandbox
          PAYMENT_SANDBOX_ENABLED: 'true'
          # پنجره‌ی کوتاهِ تأییدِ رمز تا سفرِ امنیت پنجره‌ی رمز را واقعاً ببیند (فاز ۱۰)
          AUTH_PASSWORD_TIMEOUT: '5'

      - name: نگه‌داشتنِ گزارشِ شکست
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────
  #  قیدهای دیتابیس روی موتورِ واقعیِ محصول
  # ────────────────────────────────────────────────────────────────────────
  #
  #  ⚠️ این job از یک شکستِ واقعی زاده شد، نه از برنامه‌ریزی.
  #
  #  مهاجرتِ قیدهای مالی (R52) با `ALTER TABLE ... ADD CONSTRAINT ... CHECK`
  #  اضافه می‌شود. اندازه‌گیریِ محلی نشان داده بود SQLite می‌پذیردش — و
  #  درست هم بود، **برای SQLite ۳٫۵۳٫۲ که روی آن ماشین بود**. SQLiteِ رانرِ
  #  اوبونتو قدیمی‌تر است و همان دستور را با
  #  `near "CONSTRAINT": syntax error` رد کرد؛ ۷۸۲ تست شکست.
  #
  #  مهاجرت حالا پشتیبانی را می‌سنجد و اگر نبود رد می‌شود. ولی آن‌وقت روی
  #  SQLite هیچ قیدی نصب نمی‌شود، یعنی تست‌های `SchemaConstraintTest`
  #  چیزی برای سنجیدن ندارند و skip می‌شوند.
  #
  #  ⚠️ **skipِ همیشگی یعنی محافظت هرگز سنجیده نمی‌شود.** پس همان تست‌ها
  #  اینجا روی MySQL — موتورِ واقعیِ محصول — اجرا می‌شوند، با
  #  `REQUIRE_DB_CONSTRAINTS=1` که skip را هم ممنوع می‌کند: اگر قیدی نصب
  #  نشده باشد، تست **شکست** می‌خورد.
  #
  #  ─── چرا فقط همین تست‌ها ─────────────────────────────────────────────
  #  اجرای کلِ سوییت روی MySQL چند برابر کندتر است و بعضی تست‌ها عمداً
  #  رفتارِ SQLite را می‌سنجند (`test_sqlite_silently_drops_the_row_lock`
  #  در R50) و روی MySQL باید شکست بخورند. این job فقط همان چیزی را
  #  می‌سنجد که SQLite نمی‌تواند بسنجد.
  #
  #  🔴 `SecretHandlingTest` پس از یک شکستِ **واقعی روی سرور** اضافه شد.
  #
  #  ستونِ `complexes.gateway_config` با `$table->json(...)` ساخته شده. در
  #  MySQL این یک نوعِ واقعی است و محتوایش اعتبارسنجی می‌شود؛ روی SQLite
  #  همان ستون فقط TEXT است. مهاجرتِ رمزگذاریِ R55 رمزنگاشت را خام
  #  می‌نوشت — روی SQLite بی‌ایراد، روی MySQL:
  #
  #      SQLSTATE[22032]: 3140 Invalid JSON text: "Invalid value."
  #
  #  همه‌ی ۱۴ تستِ محلی سبز بودند. تنها چیزی که این را می‌گرفت، اجرای
  #  همان تست‌ها روی موتورِ واقعی بود.
  #
  #  ⚠️ به `needs: frontend` نیاز ندارد: از وقتی فایلِ مسیرها دیگر هنگامِ
  #  بوت `Vite::asset()` صدا نمی‌زند، این تست‌ها بدونِ `public/build` هم
  #  بالا می‌آیند — و هیچ‌کدامشان صفحه‌ای رندر نمی‌کنند.
  database-constraints:
    name: قیدهای دیتابیس روی MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        # بدونِ health check، مرحله‌ی بعد پیش از بالا آمدنِ دیتابیس
        # می‌دود و با «connection refused» می‌افتد
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    steps:
      - uses: actions/checkout@v4

      - name: نصب PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, zip, intl, bcmath, pdo_mysql, mbstring, exif
          coverage: none

      - name: نصب وابستگی‌ها
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: آماده‌سازیِ محیط
        run: |
          cp .env.example .env
          php artisan key:generate

      # ⚠️ متغیرهای محیطیِ jobـسطح بر `<env>`های `phpunit.xml` **غلبه
      # می‌کنند** (PHPUnit بدونِ `force="true"` متغیرِ موجود را بازنویسی
      # نمی‌کند). این رفتار پیش از نوشتنِ این job سنجیده شد.
      - name: تستِ قیدها روی MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: root
          REQUIRE_DB_CONSTRAINTS: '1'
        # CheckoutConcurrencyTest (مرحلهٔ ۹ · فاز ۵): چند پردازه‌ی هم‌زمان روی یک قصدِ خرید —
        # فقط اینجا قفلِ ردیفِ واقعی است؛ روی SQLite قفلِ کلِ پایگاه‌داده جایش را می‌گیرد
        run: php artisan test --filter="SchemaConstraintTest|SecretHandlingTest|ChaosTest|CheckoutConcurrencyTest"

  # ────────────────────────────────────────────────────────────────────────
  #  امنیت
  # ────────────────────────────────────────────────────────────────────────
  #
  #  ⚠️ جدا از دو کارِ بالا و **موازی** با آن‌ها.
  #
  #  اگر داخلِ همان jobها بود، شکستِ یک لینت جلوی دیدنِ آسیب‌پذیری را
  #  می‌گرفت — و آسیب‌پذیری چیزی نیست که بخواهی پشتِ یک خطای قالب‌بندی
  #  پنهان بماند.
  security:
    name: امنیت
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: نصب PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # ⚠️ `--locked` یعنی خودِ `composer.lock` سنجیده می‌شود بدونِ نصب.
      # سریع‌تر است و مهم‌تر: دقیقاً همان نسخه‌هایی را می‌بیند که مستقر
      # می‌شوند، نه چیزی که ممکن است هنگامِ نصب حل شود.
      - name: آسیب‌پذیریِ وابستگی‌های PHP
        run: composer audit --locked --no-interaction

      # سه سطح (مرحلهٔ ۵ · فاز ۹):
      #   ① وابستگی‌های محصول، از «بالا» به بعد → شکست
      #   ② ابزارِ توسعه، «بحرانی» → شکست
      #   ③ ابزارِ توسعه، «متوسط» به بعد → هشدار
      #
      # 🔴 چرا ابزارِ توسعه دیگر نادیده نمی‌ماند: نسخه‌ی قبلی فقط
      # `--omit=dev` می‌سنجید با این استدلال که «ابزارِ توسعه در محصول اجرا
      # نمی‌شود». ولی اجرا می‌شود — در `deploy.yml`، روی رانری که کلیدِ SSHِ
      # سرورِ محصول را دارد (`npm ci` و `vite build`). در فاز ۹ همین نقطهٔ
      # کور ۹ آسیب‌پذیری با ۲ «بحرانی» داشت و CI سبز بود.
      #
      # ⚠️ چرا تلاشِ دوباره، و چرا این دروازه را ضعیف نمی‌کند:
      # `npm audit` برای **دو چیزِ کاملاً متفاوت** کدِ ۱ می‌دهد — «آسیب‌پذیری
      # پیدا شد» و «سرویسِ مشاوره‌های npm در دسترس نیست». دومی سه اجرای
      # پیاپی را قرمز کرد در حالی که همان دستور محلی «۰ آسیب‌پذیری» می‌داد.
      #
      # 🔴 دروازه‌ای که برای قطعیِ سرویسِ بیرونی زنگ بزند، همان دروازه‌ای است
      # که ظرفِ یک ماه کسی جدی‌اش نمی‌گیرد — درسِ تکرارشونده‌ی R43، R58 و
      # R64 دربارهٔ هشدارِ کاذب.
      #
      # پس فقط **خطای شبکه** دوباره تلاش می‌شود؛ خروجی‌ای که واقعاً
      # آسیب‌پذیری گزارش کند، همان بارِ اول شکست می‌دهد.
      - name: آسیب‌پذیریِ وابستگی‌های Node
        run: |
          # ۰ = پاک · ۱ = آسیب‌پذیری · ۲ = سرویس پس از سه تلاش پاسخ نداد
          audit() {
            for attempt in 1 2 3; do
              if output=$(npm audit "$@" 2>&1); then
                echo "$output"
                return 0
              fi

              echo "$output"

              if ! grep -qE 'audit endpoint returned an error|Service Unavailable|ENOTFOUND|ETIMEDOUT' <<<"$output"; then
                return 1
              fi

              echo "::warning::سرویسِ مشاوره‌های npm در دسترس نبود (تلاشِ $attempt از ۳)."
              sleep $((attempt * 20))
            done

            return 2
          }

          # ⚠️ `|| code=$?` و نه `; code=$?`: شلِ Actions با `-e` اجرا می‌شود و
          # خروجِ غیرِصفر پیش از خوانده‌شدنِ کد، کلِ گام را می‌بست.
          code=0; audit --omit=dev --audit-level=high || code=$?
          [ $code -eq 1 ] && { echo '::error::آسیب‌پذیری در وابستگی‌های محصول.'; exit 1; }
          [ $code -eq 2 ] && { echo '::error::سرویسِ مشاوره‌های npm پس از سه تلاش پاسخ نداد.'; exit 1; }

          code=0; audit --audit-level=critical || code=$?
          [ $code -eq 1 ] && { echo '::error::آسیب‌پذیریِ بحرانی در ابزارِ توسعه — همان‌که در استقرار کنارِ کلیدِ SSH اجرا می‌شود.'; exit 1; }

          audit --audit-level=moderate >/dev/null || echo '::warning::ابزارِ توسعه آسیب‌پذیریِ غیرِبحرانی دارد؛ `npm audit` را ببینید.'
          exit 0

      # ⚠️ «پکیجِ مخرب» (بندِ ۷۱): امضای رجیستریِ هر پکیجِ نصب‌شده. پکیجی که
      # پس از انتشار دست‌کاری شده یا از رجیستریِ دیگری آمده، امضا ندارد.
      # `--ignore-scripts` چون همین‌جا هنوز نمی‌دانیم کدام پکیج قابلِ اعتماد است.
      - name: امضای پکیج‌ها
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit signatures
