; ==============================================================================
;  OPcache (R41)
; ==============================================================================
;
;  بدونِ این، PHP در هر درخواست همه‌ی فایل‌ها را دوباره تجزیه و کامپایل
;  می‌کند. روی برنامه‌ای به این اندازه، تفاوتش چند برابر است نه چند درصد.

opcache.enable = 1
opcache.enable_cli = 0

; ۱۲۸ مگابایت برای لاراول ۱۳ به‌علاوه‌ی وابستگی‌ها. زیرِ این مقدار، OPcache
; شروع می‌کند به بیرون‌انداختنِ فایل‌ها و عملاً مزیتش را از دست می‌دهد.
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; ⚠️ صفر یعنی «فایل‌ها را برای تغییر چک نکن».
;
; در محصول سریع‌ترین حالت است، ولی **شرط دارد**: هر استقرار باید کانتینر را
; از نو بسازد یا OPcache را پاک کند. وگرنه کدِ تازه اجرا نمی‌شود و ساعت‌ها
; دنبالِ باگی می‌گردی که از قبل درستش کرده‌ای.
opcache.validate_timestamps = 0

; ⚠️ کامنت‌ها لازم‌اند. لاراول و attributeهای PHP با ریفلکشن رویشان حساب
; می‌کنند؛ خاموش‌کردنش کمی حافظه کم می‌کند و برنامه را می‌شکند.
opcache.save_comments = 1

opcache.fast_shutdown = 1
