; ==============================================================================
;  استخرِ PHP-FPM (R41)
; ==============================================================================

[www]
; ⚠️ روی TCP و نه سوکتِ یونیکس.
;
; nginx در کانتینرِ **دیگری** است و سوکتِ فایلی بین دو کانتینر مشترک نیست.
; روی یک سرورِ تک‌ماشینی سوکت سریع‌تر است — و همان چیزی است که در
; `docs/DEPLOYMENT.md` برای سرورِ فعلی پیشنهاد شده.
listen = 0.0.0.0:9000

; ─── تعدادِ پردازه ───────────────────────────────────────────────────────
;
; `dynamic` تعادلِ درست برای بارِ نامنظمِ یک پنلِ مدیریت است: بیشترِ ماه
; خلوت، و اولِ هر ماه که قبض‌ها صادر می‌شوند شلوغ.
;
; هر پردازه حدودِ ۶۰ مگابایت می‌گیرد و با mPDF بیشتر، پس ۲۰ پردازه یعنی
; سقفِ ~۱٫۲ گیگابایت. روی سرورِ کم‌رم این عدد باید پایین بیاید.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6

; ⚠️ بازیافتِ پردازه پس از ۵۰۰ درخواست.
;
; mPDF حافظه‌ای را که می‌گیرد پس نمی‌دهد (اندازه‌گیریِ R28). بدونِ بازیافت،
; پردازه‌ای که چند PDF ساخته صدها مگابایت را تا ابد نگه می‌دارد و کم‌کم
; سرور را می‌خورد.
pm.max_requests = 500

; مسیرِ سلامت برای HEALTHCHECK؛ خودِ FPM جواب می‌دهد بی‌آنکه لاراول بالا بیاید
ping.path = /ping
ping.response = pong

; هر درخواستِ بیش از ۵ ثانیه با stack trace در لاگ می‌آید
slowlog = /dev/stderr
request_slowlog_timeout = 5s

; خروجیِ خطای پردازه به stderr می‌رود تا `docker logs` ببیندش
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
