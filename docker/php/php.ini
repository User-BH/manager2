; ==============================================================================
;  تنظیماتِ PHP برای ساکنا (R41)
; ==============================================================================

; ─── حافظه ───────────────────────────────────────────────────────────────
;
; ⚠️ ۲۵۶ مگابایت حداقلِ واقعی است، نه احتیاط.
;
; در R28 اندازه‌گیری شد: mPDF هنگامِ ساختِ PDFِ فارسی با فونتِ Vazirmatn
; حدودِ ۳۰ مگابایت را **دائمی** نگه می‌دارد، و ساختِ دسته‌ایِ قبض‌ها روی
; پیش‌فرضِ ۱۲۸ مگابایت با «Allowed memory size exhausted» می‌افتاد.
memory_limit = 256M

; ─── آپلود ───────────────────────────────────────────────────────────────
;
; سقفِ خودِ برنامه ۴ مگابایت است (رسیدِ اشتراک و پیوستِ پیام‌رسان). اینجا
; کمی بالاتر گرفته شده تا PHP پیش از رسیدنِ درخواست به لاراول ردش نکند —
; وگرنه کاربر به‌جای پیامِ فارسیِ ما، خطای خامِ سرور می‌بیند.
upload_max_filesize = 8M
post_max_size = 10M
max_file_uploads = 10

; ─── زمان ────────────────────────────────────────────────────────────────
;
; خروجیِ Excel و PDFِ دسته‌ای کند است ولی از صف می‌رود، پس درخواستِ وب
; نباید بیش از این طول بکشد؛ اگر کشید، جایی گیر کرده.
max_execution_time = 60
max_input_time = 60

; ─── امنیت ───────────────────────────────────────────────────────────────
;
; نسخه‌ی PHP در هدرِ پاسخ چیزی به کاربر نمی‌دهد و به مهاجم می‌گوید دنبالِ
; کدام آسیب‌پذیری بگردد.
expose_php = Off

; خطا در لاگ می‌رود نه در پاسخ؛ نمایشِ خطا در محصول یعنی افشای مسیر و کوئری
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; ─── منطقه‌ی زمانی ───────────────────────────────────────────────────────
;
; ⚠️ بدونِ این، PHP روی UTC می‌ماند و تبدیلِ جلالی نزدیکِ نیمه‌شب یک روز
; جابه‌جا می‌شود — باگی که فقط بین ۲۰:۳۰ تا نیمه‌شب دیده می‌شود.
date.timezone = Asia/Tehran

; ─── نشست ────────────────────────────────────────────────────────────────
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
