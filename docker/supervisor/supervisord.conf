; ==============================================================================
;  supervisor — کارگرِ صف و زمان‌بند (R41)
; ==============================================================================
;
;  ─── چرا کانتینرِ جدا و نه کنارِ PHP-FPM ────────────────────────────────
;  کارگرِ صف و وب دو الگوی مقیاس‌پذیریِ متفاوت دارند: وب با تعدادِ کاربر
;  بالا می‌رود و صف با حجمِ کار. در یک کانتینر، بالابردنِ یکی یعنی
;  بالابردنِ بی‌دلیلِ دیگری. ضمناً کرشِ کارگر نباید سایت را ببرد.
;
;  همان تصویر استفاده می‌شود، فقط با فرمانِ متفاوت.

[supervisord]
nodaemon = true
user = www-data
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /tmp/supervisord.pid

; ──────────────────────────────────────────────────────────────────────────────
;  کارگرِ صف
; ──────────────────────────────────────────────────────────────────────────────
[program:queue]
command = php /var/www/html/artisan queue:work --tries=3 --max-time=3600 --sleep=3 --backoff=10
directory = /var/www/html
user = www-data
autostart = true
autorestart = true

; ⚠️ دو کارگر، نه بیشتر.
;
; کارِ سنگینِ این پروژه ساختِ PDF است و mPDF حافظه‌اش را پس نمی‌دهد
; (اندازه‌گیریِ R28: ~۳۰ مگابایتِ دائمی). چهار کارگرِ هم‌زمان یعنی چهار
; پردازه که هرکدام صدها مگابایت نگه می‌دارند.
numprocs = 2
process_name = %(program_name)s_%(process_num)02d

; ⚠️ `--max-time=3600` عمدی است و مکملِ همان مشکل.
;
; کارگر پس از یک ساعت خودش را می‌کشد و supervisor تازه‌اش را بالا می‌آورد،
; پس حافظه‌ی نشت‌کرده هر ساعت آزاد می‌شود. بدونِ آن، کارگرِ چندروزه کم‌کم
; کلِ رم را می‌گیرد.
stopwaitsecs = 3600
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; ──────────────────────────────────────────────────────────────────────────────
;  زمان‌بند
; ──────────────────────────────────────────────────────────────────────────────
;
;  ⚠️ `schedule:work` و نه cron.
;
;  در کانتینر، cron یک دیمنِ دومی است که باید خودش زنده نگه داشته شود و
;  لاگش جای دیگری می‌رود. `schedule:work` یک پردازه‌ی معمولی است که هر
;  دقیقه بیدار می‌شود — supervisor همان‌طور که کارگر را می‌پاید، این را هم
;  می‌پاید و لاگش به `docker logs` می‌رسد.
[program:scheduler]
command = php /var/www/html/artisan schedule:work
directory = /var/www/html
user = www-data
autostart = true
autorestart = true
numprocs = 1
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
