# ==============================================================================
#  nginx — فقط داخلِ کانتینر (R41)
# ==============================================================================
#
#  ⚠️ این فایل **کانفیگِ nginxِ سرورِ شما نیست و جایگزینش نمی‌شود**.
#
#  قیدِ کارفرما: کانفیگِ nginxِ موجود دست‌کاری نشود و مسیرِ PHP 7.4 آسیب
#  نبیند. این فایل داخلِ کانتینرِ nginx زندگی می‌کند، روی پورتِ ۸۰ی همان
#  کانتینر گوش می‌دهد، و از بیرون فقط روی پورتی که در `compose.yaml` تعیین
#  شده (پیش‌فرض ۸۰۸۰) دیده می‌شود.
#
#  آنچه برای سرورِ فعلی **پیشنهاد** شده، در `docs/DEPLOYMENT.md` است — به
#  شکلِ متن، نه به شکلِ فایلی که کسی اشتباهی کپی کند.
# ==============================================================================

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # ─── سقفِ آپلود ──────────────────────────────────────────────────────
    #
    # باید با `post_max_size`ِ PHP بخواند. اگر nginx سخت‌گیرتر باشد،
    # کاربر خطای ۴۱۳ی خامِ nginx را می‌بیند نه پیامِ فارسیِ برنامه را.
    client_max_body_size 10M;

    # ─── فشرده‌سازی ──────────────────────────────────────────────────────
    #
    # اندازه‌گیریِ R36: خروجیِ JS/CSS با gzip به ۳۱٪ می‌رسد.
    #
    # ⚠️ `gzip_static on` یعنی اگر فایلِ `.gz` از پیش ساخته‌شده کنارِ اصلی
    # باشد همان سرو می‌شود؛ اگر نباشد، بی‌صدا به فشرده‌سازیِ لحظه‌ای
    # برمی‌گردد. پس گذاشتنش بی‌خطر است حتی وقتی فایلِ `.gz` نداریم.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/xml+rss application/rss+xml font/woff2 image/svg+xml;
    gzip_static on;

    # ─── دارایی‌های اثرانگشت‌دار ────────────────────────────────────────
    #
    # نامشان هش دارد، پس محتوایشان هرگز عوض نمی‌شود. `immutable` به مرورگر
    # می‌گوید حتی درخواستِ اعتبارسنجی هم نفرست.
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:woff2?|ttf|otf|png|jpe?g|webp|avif|gif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
        try_files $uri =404;
    }

    # ─── service worker ─────────────────────────────────────────────────
    #
    # ⚠️ `sw.js` هرگز نباید کش شود.
    #
    # اگر مرورگر نسخه‌ی کهنه‌ی آن را نگه دارد، کاربر در نسخه‌ی قدیمِ کلِ
    # برنامه گیر می‌کند — چون همان فایل است که تصمیم می‌گیرد چه چیزی از کش
    # بیاید. این تنها فایلی است که کش‌کردنش می‌تواند به‌روزرسانی را برای
    # همیشه ببندد.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # نامِ سرویس در `compose.yaml`؛ شبکه‌ی داخلیِ compose آن را حل می‌کند
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # ساختِ PDFِ دسته‌ای و خروجیِ Excel کند است؛ پیش‌فرضِ ۶۰ ثانیه‌ی
        # nginx گاهی وسطِ کار قطع می‌کرد
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # ⚠️ فایل‌های نقطه‌دار (`.env`، `.git`) هرگز نباید سرو شوند.
    #
    # استثنا `.well-known` است که برای تمدیدِ گواهیِ TLS لازم می‌شود.
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}
