<!--
  آیکونِ تک‌رنگ (R35).

  سیستم‌عامل این را با رنگِ خودش پر می‌کند (نوارِ وضعیت، ویجت، حالتِ
  تمرکز). پس هر رنگی اینجا نوشته شود دور ریخته می‌شود و فقط **شکل** مهم
  است: باید یک‌تکه و پر باشد، نه چندلایه با رنگ‌های متفاوت.

  ⚠️ به همین دلیل از خودِ favicon استفاده نشد: آنجا پنجره‌ها با رنگِ روشن
  روی بدنه‌ی تیره کنده شده‌اند، و وقتی همه‌چیز یک‌رنگ شود پنجره‌ها ناپدید
  می‌شوند و فقط یک لکه می‌ماند. اینجا پنجره‌ها با `fill-rule="evenodd"`
  سوراخِ واقعی‌اند، پس در هر رنگی دیده می‌شوند.
-->
