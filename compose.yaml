# ==============================================================================
#  ساکنا — محیطِ کانتینریِ جدا و اختیاری (R41)
# ==============================================================================
#
#  ⚠️ این فایل هیچ‌چیزی از سرورِ فعلی را عوض نمی‌کند.
#
#  قیدِ کارفرما صریح بود: کانفیگِ nginxِ موجود دست‌کاری نشود، MySQL و
#  phpMyAdminِ نصب‌شده دست‌نخورده بمانند، و مسیرِ PHP 7.4 آسیب نبیند. پس:
#
#  • همه‌ی سرویس‌ها در شبکه‌ی خودشان‌اند و از بیرون فقط با پورت‌هایی دیده
#    می‌شوند که **عمداً غیرِ استاندارد** انتخاب شده‌اند (۸۰۸۰ به‌جای ۸۰،
#    ۳۳۰۶۱ به‌جای ۳۳۰۶، ۶۳۷۹۱ به‌جای ۶۳۷۹). حتی اگر سرویسِ مشابهی روی
#    میزبان بدود، تصادمی رخ نمی‌دهد.
#  • دیتابیسِ این محیط **جداست** و به MySQLِ موجود دست نمی‌زند.
#  • هر پورت با متغیرِ محیطی قابلِ تغییر است، پس اگر همین‌ها هم گرفته
#    باشند یک خط عوض می‌شود.
#
#  ─── اجرا ────────────────────────────────────────────────────────────────
#      cp .env.docker.example .env.docker
#      docker compose --env-file .env.docker up -d --build
#
#  ─── سرورِ فعلی چه؟ ──────────────────────────────────────────────────────
#  پیشنهادهای تنظیمِ nginx و PHP-FPM برای همان سرور، در
#  `docs/DEPLOYMENT.md` به شکلِ **متن** آمده — نه فایلی که کسی اشتباهی
#  رویش کپی کند.
# ==============================================================================

name: sakena

services:
  # ────────────────────────────────────────────────────────────────────────
  #  برنامه — PHP-FPM
  # ────────────────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.4}
    restart: unless-stopped
    environment:
      CONTAINER_ROLE: app
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-sakena}
      DB_USERNAME: ${DB_USERNAME:-sakena}
      DB_PASSWORD: ${DB_PASSWORD}
      # ⚠️ در این محیط Redis است، ولی `.env`ِ سرورِ فعلی دست‌نخورده می‌ماند
      # و همچنان `database` است. این تصمیم مالِ همین کانتینرهاست.
      REDIS_HOST: cache
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    volumes:
      # فقط چیزهایی که باید بینِ بازسازی‌ها بمانند
      - storage:/var/www/html/storage/app
      - logs:/var/www/html/storage/logs
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks: [sakena]

  # ────────────────────────────────────────────────────────────────────────
  #  وب‌سرور
  # ────────────────────────────────────────────────────────────────────────
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      # ⚠️ فقط روی ۱۲۷.۰.۰.۱ — از بیرونِ ماشین دیده نمی‌شود.
      #
      # بدونِ این پیشوند، Docker قاعده‌ی iptables می‌سازد که **فایروالِ
      # میزبان را دور می‌زند** و سرویس روی اینترنت باز می‌شود بی‌آنکه کسی
      # خواسته باشد. برای دسترسیِ عمومی باید عمداً برداشته شود.
      - '127.0.0.1:${WEB_PORT:-8080}:80'
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # nginx باید خودش فایل‌های ثابت را سرو کند، پس به همان کد نیاز دارد
      - ./public:/var/www/html/public:ro
    depends_on:
      - app
    networks: [sakena]

  # ────────────────────────────────────────────────────────────────────────
  #  کارگرِ صف و زمان‌بند
  # ────────────────────────────────────────────────────────────────────────
  #
  #  همان تصویرِ `app`، فقط با فرمانِ متفاوت — پس نسخه‌ی کد همیشه یکی است.
  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.4}
    restart: unless-stopped
    command: ['supervisord', '-c', '/etc/supervisor/supervisord.conf']
    environment:
      # ⚠️ `worker` یعنی entrypoint مهاجرت **نمی‌زند**.
      #
      # اگر هر دو کانتینر `migrate` می‌زدند، دو پردازه هم‌زمان روی جدولِ
      # مهاجرت می‌نوشتند.
      CONTAINER_ROLE: worker
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-sakena}
      DB_USERNAME: ${DB_USERNAME:-sakena}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: cache
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    volumes:
      - storage:/var/www/html/storage/app
      - logs:/var/www/html/storage/logs
    depends_on:
      app:
        condition: service_started
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks: [sakena]

  # ────────────────────────────────────────────────────────────────────────
  #  دیتابیس — جدا از MySQLِ موجودِ سرور
  # ────────────────────────────────────────────────────────────────────────
  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-sakena}
      MYSQL_USER: ${DB_USERNAME:-sakena}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    command:
      # ⚠️ `utf8mb4` و collationِ `_unicode_ci` اجباری است.
      #
      # با `utf8` (که در MySQL سه‌بایتی است) نیم‌فاصله و بعضی نویسه‌های
      # فارسی و ایموجیِ پیام‌رسان بی‌صدا بریده می‌شوند.
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - database:/var/lib/mysql
    ports:
      # پورتِ غیرِ استاندارد و فقط روی لوکال؛ برای وصل‌شدن با کلاینتِ محلی
      - '127.0.0.1:${DB_PORT_HOST:-33061}:3306'
    healthcheck:
      # ⚠️ `mysqladmin ping` و نه `nc -z 3306`.
      #
      # پورت خیلی زودتر از آماده‌شدنِ خودِ موتور باز می‌شود؛ با بررسیِ پورت،
      # کانتینرِ برنامه زودهنگام شروع می‌کرد و اولین `migrate` می‌افتاد.
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-p${DB_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [sakena]

  # ────────────────────────────────────────────────────────────────────────
  #  کش و صف
  # ────────────────────────────────────────────────────────────────────────
  cache:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      # ⚠️ `appendonly` روشن است چون این Redis **صف** هم هست.
      #
      # برای کشِ صرف، از دست رفتنِ داده با ریست بی‌اهمیت است. ولی کارِ
      # صف‌شده که گم شود یعنی قبضی صادر نشده یا پیامکی نرفته و هیچ‌کس
      # نمی‌فهمد.
      - redis-server
      - --appendonly
      - 'yes'
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      # ⚠️ `noeviction` و نه `allkeys-lru`.
      #
      # با LRU، Redis زیرِ فشارِ حافظه **کارهای صف را هم** دور می‌اندازد،
      # چون فرقی بین کلیدِ کش و کلیدِ صف نمی‌گذارد. `noeviction` به‌جایش
      # خطا می‌دهد — که دیده می‌شود.
      - --maxmemory-policy
      - noeviction
    volumes:
      - cache:/data
    ports:
      - '127.0.0.1:${REDIS_PORT_HOST:-63791}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [sakena]

networks:
  sakena:
    driver: bridge

volumes:
  database:
  cache:
  storage:
  logs:
